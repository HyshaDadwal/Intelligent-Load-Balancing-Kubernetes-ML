apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: intelligent-load-balancer-hpa

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: intelligent-load-balancer

  minReplicas: 1
  maxReplicas: 5

  metrics:
  - type: Resource

    resource:
      name: cpu

      target:
        type: Utilization
        averageUtilization: 50